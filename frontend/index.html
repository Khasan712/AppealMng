<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Appeal Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Appeal Management</div>
    <nav id="nav" class="nav hidden">
      <button data-view="appeals" class="nav-btn active">Appeals</button>
      <button data-view="notifications" class="nav-btn">Notifications</button>
      <button data-view="categories" class="nav-btn admin-only">Categories</button>
      <button data-view="users" class="nav-btn admin-only">Users</button>
      <button data-view="stats" class="nav-btn admin-only">Statistics</button>
    </nav>
    <div id="userbox" class="userbox hidden">
      <span id="user-label"></span>
      <button id="logout-btn" class="btn btn-ghost">Logout</button>
    </div>
  </header>

  <main id="app" class="container">
    <!-- AUTH -->
    <section id="view-auth" class="view">
      <div class="card auth-card">
        <div class="tabs">
          <button class="tab active" data-tab="login">Login</button>
          <button class="tab" data-tab="register">Register</button>
        </div>
        <form id="login-form" class="form">
          <label>Phone <input name="phone" placeholder="+998901234567" required></label>
          <label>Password <input name="password" type="password" required></label>
          <button class="btn btn-primary" type="submit">Login</button>
        </form>
        <form id="register-form" class="form hidden">
          <label>Phone <input name="phone" placeholder="+998901234567" required></label>
          <label>Full name <input name="full_name" placeholder="Optional"></label>
          <label>Password <input name="password" type="password" minlength="6" required></label>
          <button class="btn btn-primary" type="submit">Create account</button>
        </form>
        <p class="hint">Managers and administrators are created by an administrator. Appeals submitted via the Telegram bot appear here after registering with the same phone number.</p>
      </div>
    </section>

    <!-- APPEALS LIST -->
    <section id="view-appeals" class="view hidden">
      <div class="toolbar">
        <h1>Appeals</h1>
        <div class="filters">
          <select id="filter-status">
            <option value="">All statuses</option>
            <option>NEW</option><option>IN_PROGRESS</option><option>REJECTED</option><option>CLOSED</option>
          </select>
          <select id="filter-category"><option value="">All categories</option></select>
          <button id="new-appeal-btn" class="btn btn-primary appealer-only">+ New appeal</button>
        </div>
      </div>
      <div id="appeals-table" class="card table-wrap"></div>
    </section>

    <!-- APPEAL DETAIL -->
    <section id="view-detail" class="view hidden">
      <button id="back-btn" class="btn btn-ghost">← Back to list</button>
      <div id="detail" class="detail-grid"></div>
    </section>

    <!-- NEW APPEAL -->
    <section id="view-new" class="view hidden">
      <div class="card narrow">
        <h1>New appeal</h1>
        <form id="appeal-form" class="form">
          <label>Contact phone <input name="phone" placeholder="+998901234567" required></label>
          <label>Category <select name="category_id" id="appeal-category" required></select></label>
          <label>Description <textarea name="description" rows="6" minlength="10" maxlength="2000" required placeholder="10–2000 characters"></textarea></label>
          <div class="row">
            <button class="btn btn-primary" type="submit">Submit appeal</button>
            <button class="btn btn-ghost" type="button" id="cancel-new">Cancel</button>
          </div>
        </form>
      </div>
    </section>

    <!-- NOTIFICATIONS -->
    <section id="view-notifications" class="view hidden">
      <h1>Notifications</h1>
      <div id="notifications-list" class="card"></div>
    </section>

    <!-- CATEGORIES (admin) -->
    <section id="view-categories" class="view hidden">
      <div class="toolbar"><h1>Categories</h1></div>
      <div class="two-col">
        <div id="categories-table" class="card table-wrap"></div>
        <div class="card">
          <h2>Create category</h2>
          <form id="category-form" class="form">
            <label>Name <input name="name" required></label>
            <label>Responsible manager <select name="responsible_user_id" id="category-manager" required></select></label>
            <button class="btn btn-primary" type="submit">Create</button>
          </form>
        </div>
      </div>
    </section>

    <!-- USERS (admin) -->
    <section id="view-users" class="view hidden">
      <div class="toolbar"><h1>Users</h1></div>
      <div class="two-col">
        <div id="users-table" class="card table-wrap"></div>
        <div class="card">
          <h2>Create user</h2>
          <form id="user-form" class="form">
            <label>Phone <input name="phone" placeholder="+998901234567" required></label>
            <label>Full name <input name="full_name"></label>
            <label>Password <input name="password" type="password" minlength="6" required></label>
            <label>Role
              <select name="role"><option>MANAGER</option><option>ADMIN</option><option>APPEALER</option></select>
            </label>
            <button class="btn btn-primary" type="submit">Create</button>
          </form>
        </div>
      </div>
    </section>

    <!-- STATS (admin) -->
    <section id="view-stats" class="view hidden">
      <h1>Statistics</h1>
      <div id="stats" class="stats-grid"></div>
    </section>
  </main>

  <!-- ACTION MODAL -->
  <div id="modal" class="modal hidden">
    <div class="modal-box card">
      <h2 id="modal-title"></h2>
      <form id="modal-form" class="form">
        <div id="modal-fields"></div>
        <div class="row">
          <button class="btn btn-primary" type="submit" id="modal-submit">Confirm</button>
          <button class="btn btn-ghost" type="button" id="modal-cancel">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
